[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cti-lab"
version = "0.1.0"
description = "A modular cyber threat-intelligence collection and analysis pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
  "pytest-cov>=5.0,<6",
  "ruff>=0.6,<1",
]

[project.scripts]
cti-pipeline = "cti_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cti_pipeline*"]
exclude = [
  "scripts*",
  "tools*",
  "tests*",
  "iocs*",
  "pcaps*",
  "reports*",
  "artifacts*",
  "campaigns*",
  "yara_rules*",
  "sample_data*",
]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
  "scripts",
  "tools",
  "cti-venv",
  ".venv",
  "venv",
  "build",
  "dist",
]
